name: Bug report
description: Report a reproducible MeetingVault defect using non-private evidence.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach real recordings, transcripts, credentials, recovery keys, or other private data. Use synthetic fixtures and follow SECURITY.md for suspected vulnerabilities.
  - type: input
    id: version
    attributes:
      label: MeetingVault version or commit
      placeholder: 0.1.0 or a full commit SHA
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 26.x, Apple silicon model
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation source
      options:
        - Built from source
        - Official GitHub release
        - Fork or modified build
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use a synthetic or explicitly approved non-private fixture.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Non-private diagnostics
      description: Redact personal paths and identifiers. Do not paste meeting content or secrets.
  - type: checkboxes
    id: safety
    attributes:
      label: Data-safety confirmation
      options:
        - label: I removed private meeting data, credentials, and personal identifiers from this report.
          required: true
        - label: This is not a vulnerability report; security-sensitive reports belong in GitHub private vulnerability reporting.
          required: true
